version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: t1d-postgres
    environment:
      POSTGRES_DB: t1d_companion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: t1d-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: t1d-app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/t1d_companion
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEXCOM_CLIENT_ID=${DEXCOM_CLIENT_ID:-}
      - DEXCOM_CLIENT_SECRET=${DEXCOM_CLIENT_SECRET:-}
      - DEXCOM_REDIRECT_URI=${DEXCOM_REDIRECT_URI:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: t1d-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # ── Nightscout CGM Stack (for Freestyle Libre / any CGM) ──
  nightscout-mongo:
    image: mongo:7
    container_name: t1d-ns-mongo
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  nightscout:
    image: nightscout/cgm-remote-monitor:latest
    container_name: t1d-nightscout
    ports:
      - "4000:1337"
    environment:
      - MONGO_CONNECTION=mongodb://nightscout-mongo:27017/nightscout
      - API_SECRET=Skimmer69tom1Z!!!
      - DISPLAY_UNITS=mg/dL
      - THEME=colors
      - ENABLE=careportal boluscalc food bwp cage iage treatment
      - TIME_FORMAT=24
      - HEARTBEAT=true
      - INSECURE_USE_HTTP=true
    depends_on:
      nightscout-mongo:
        condition: service_started
    restart: unless-stopped

  libre-bridge:
    image: timoschlueter/nightscout-librelink-up:latest
    container_name: t1d-libre-bridge
    environment:
      - LINK_UP_USERNAME=tomm.batchelor@gmail.com
      - LINK_UP_PASSWORD=reJvy7-totzov-tabmes
      - NIGHTSCOUT_URL=nightscout:1337
      - NIGHTSCOUT_DISABLE_HTTPS=true
      - NIGHTSCOUT_API_TOKEN=33274f285cbd93f143073902dd484a357ac2dd6d
      - LINK_UP_REGION=EU2
      - LOG_LEVEL=info
    depends_on:
      - nightscout
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data: